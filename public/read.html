<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Field Guide Reader</title>
<style>
  :root{--ink:#06080F;--ice:#D9E6F5;--brass:#C08A3E}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--ice);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;
    padding:12px 16px;background:rgba(6,8,15,.94);border-bottom:1px solid rgba(192,138,62,.35)}
  header a{color:var(--brass);text-decoration:none;font-weight:600}
  #msg{max-width:640px;margin:18vh auto;padding:0 16px;text-align:center}
  #keybox{max-width:860px;margin:16px auto 0;padding:12px 16px;border:1px solid rgba(192,138,62,.4);border-radius:10px;font-size:14px}
  #keybox code{word-break:break-all;color:var(--brass);-webkit-user-select:all;user-select:all}
  #pages{max-width:860px;margin:16px auto 60px;padding:0 16px;display:grid;gap:18px}
  .pg{position:relative;overflow:hidden;border-radius:4px;background:#000}
  .pg img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
  .wm{position:absolute;inset:-50%;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;
    transform:rotate(-30deg);pointer-events:auto;color:rgba(217,230,245,.10);font-size:15px;white-space:nowrap}
  .wm span{padding:28px 36px}
  #noprint{display:none}
  @media print{
    header,#keybox,#pages,#msg{display:none!important}
    #noprint{display:block!important;visibility:visible!important;padding:40px;font-size:20px;color:#000}
  }
</style>
</head>
<body>
<header><a href="/">&larr; PNAM Website</a><span>Field Guide to the Pleiadian New Age Movement</span></header>
<div id="msg">Opening your Field Guide&hellip;</div>
<div id="keybox" hidden>This page is your personal Field Guide key. Bookmark it now so you can return any time on this computer:<br><code id="keyurl"></code></div>
<div id="pages"></div>
<div id="noprint">Printing is not available for the Field Guide.</div>
<script>
(async () => {
  const key = new URLSearchParams(location.search).get('key') || '';
  const msg = document.getElementById('msg');
  let data;
  try {
    const r = await fetch('/api/unlock?key=' + encodeURIComponent(key), { credentials: 'same-origin' });
    data = await r.json();
    if (!r.ok) throw new Error(data.error || 'The Field Guide could not be opened.');
  } catch (e) {
    msg.textContent = e.message || 'The Field Guide could not be opened.';
    return;
  }
  msg.remove();
  document.getElementById('keyurl').textContent = location.href;
  document.getElementById('keybox').hidden = false;
  const mark = data.email ? 'Licensed to ' + data.email : 'PNAM Field Guide';
  const pages = document.getElementById('pages');
  for (let n = 1; n <= data.pages; n++) {
    const pg = document.createElement('div');
    pg.className = 'pg';
    const img = new Image();
    img.alt = 'Field Guide page ' + n;
    img.loading = n > 2 ? 'lazy' : 'eager';
    img.src = '/api/page?n=' + n;
    const wm = document.createElement('div');
    wm.className = 'wm';
    wm.innerHTML = Array(40).fill(0).map(() => '<span></span>').join('');
    wm.querySelectorAll('span').forEach(s => s.textContent = mark);
    pg.append(img, wm);
    pages.append(pg);
  }
})();
// Deterrents only: a browser cannot fully stop saving or screenshots.
['contextmenu', 'dragstart', 'copy', 'cut', 'selectstart'].forEach(t =>
  document.addEventListener(t, e => { if (!e.target.closest('#keybox')) e.preventDefault(); }));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && ['p', 's', 'u'].includes(k)) e.preventDefault();
});
window.addEventListener('beforeprint', () => { document.body.style.visibility = 'hidden'; });
window.addEventListener('afterprint', () => { document.body.style.visibility = ''; });
</script>
</body>
</html>
